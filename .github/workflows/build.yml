# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: build
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - 'master'     # Run the workflow when pushing to the default branch
  pull_request:
    branches:
      - '*'          # Run the workflow for all pull requests

# Least privilege by default; jobs opt in to anything more
permissions:
  contents: read

# Cancel superseded runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v6  # SDK version from global.json

    # Builds both net472 and net10.0
    - run: dotnet build --configuration Release
